name: CLI Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/unhappy-cli/**'
      - '.github/workflows/cli-smoke-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/unhappy-cli/**'
      - '.github/workflows/cli-smoke-test.yml'
  workflow_dispatch:

jobs:
  smoke-test-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build outputs
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/unhappy-cli -> target

    - name: Build CLI
      run: cargo build --manifest-path packages/unhappy-cli/Cargo.toml --release --locked

    - name: Test binary execution
      run: |
        CLI=./packages/unhappy-cli/target/release/unhappy

        # Test that the binary starts successfully
        echo "Testing unhappy --help..."
        timeout 30s "$CLI" --help || {
          echo "Error: unhappy --help failed or timed out"
          exit 1
        }

        echo "Testing unhappy status --json..."
        timeout 10s "$CLI" status --json || {
          echo "Error: unhappy status --json failed or timed out"
          exit 1
        }

        echo "Testing unhappy doctor-processes..."
        timeout 30s "$CLI" doctor-processes || {
          echo "Error: unhappy doctor-processes failed or timed out"
          exit 1
        }

        echo "Testing unhappy daemon status..."
        timeout 10s "$CLI" daemon status || {
          echo "Error: unhappy daemon status failed or timed out"
          exit 1
        }

        echo "Smoke test passed on Linux!"

  smoke-test-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build outputs
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/unhappy-cli -> target

    - name: Build CLI
      run: cargo build --manifest-path packages/unhappy-cli/Cargo.toml --release --locked

    - name: Test binary execution
      shell: pwsh
      run: |
        $cli = ".\packages\unhappy-cli\target\release\unhappy.exe"

        Write-Host "Testing unhappy --help..."
        & $cli --help
        if ($LASTEXITCODE -ne 0) { throw "unhappy --help failed" }

        Write-Host "Testing unhappy status --json..."
        & $cli status --json
        if ($LASTEXITCODE -ne 0) { throw "unhappy status --json failed" }

        Write-Host "Testing unhappy doctor-processes..."
        & $cli doctor-processes
        if ($LASTEXITCODE -ne 0) { throw "unhappy doctor-processes failed" }

        Write-Host "Testing unhappy daemon status..."
        & $cli daemon status
        if ($LASTEXITCODE -ne 0) { throw "unhappy daemon status failed" }

        Write-Host "Smoke test passed on Windows!"

# We don't need a smoke test for macOS because most contributors are developing on macOS.
