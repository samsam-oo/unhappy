name: Monorepo Static Checks

on:
    pull_request:
        paths:
            - 'packages/unhappy-cli/**'
            - 'packages/unhappy-server/**'
            - '.github/workflows/typecheck.yml'
    push:
        branches:
            - main
        paths:
            - 'packages/unhappy-cli/**'
            - 'packages/unhappy-server/**'
            - '.github/workflows/typecheck.yml'

jobs:
    typecheck:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: yarn

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build outputs
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: packages/unhappy-cli -> target

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Rust typecheck (CLI)
              run: cargo check --manifest-path packages/unhappy-cli/Cargo.toml --all-targets --locked

            - name: TypeScript build (Server)
              run: yarn workspace unhappy-server build
