name: Build unhappy-cli release artifacts

on:
  push:
    branches:
      - main
    paths:
      - 'packages/unhappy-cli/**'
      - 'packages/unhappy-cli/Cargo.lock'
      - '.github/workflows/npm-publish-cli.yml'
    tags:
      - "unhappy-cli-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: unhappy-linux
            binary_path: packages/unhappy-cli/target/release/unhappy
          - os: macos-latest
            artifact_name: unhappy-macos
            binary_path: packages/unhappy-cli/target/release/unhappy
          - os: windows-latest
            artifact_name: unhappy-windows
            binary_path: packages/unhappy-cli/target/release/unhappy.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/unhappy-cli -> target

      - name: Build unhappy-cli
        run: cargo build --manifest-path packages/unhappy-cli/Cargo.toml --release --locked

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
